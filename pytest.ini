[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: 纯逻辑单测，无 DB
    integration: 集成测试，打真 DB
# 2026-07-15：过滤 starlette TestClient 对 httpx 的 deprecation 警告。
# 该警告是 starlette 1.x 内部 import 时主动触发的（提示升级到 `httpx2` 包），
# 与项目代码无关。`httpx2` 实际为 starlette 自定义 import 路径，pyproject
# 里 httpx>=0.x 已固定不便升级；统一在 pytest 层静默即可。
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning