# ============================================================================
# myERP 测试服务器编排（不绑定域名 / 不配置证书 / 纯 HTTP 直访）
#
# 与 docker-compose.yml（生产 HTTPS）平行，用同一套 prod 镜像 + .env.staging
# 切换行为。区别：
#   - frontend 不挂 SSL bind mount、不暴露 443；环境变量覆盖 NGINX_SERVER_NAME=_
#     NGINX_REDIRECT_TARGET=，让 nginx 模板渲染成 server_name 通配 + 无 301。
#   - postgres 走 bind mount ./data/postgres-staging（独立 volume，不污染生产）。
#   - 容器名加 -staging 后缀（与生产 myerp-* 容器不撞名）。
#   - compose name = myerp-staging（与生产 myerp 网络隔开）。
#
# 使用：
#   cp .env.staging.example .env.staging   # 然后填实际密钥
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# 验证：
#   curl -v http://<测试IP>/                  # 200，HTML 含 Vue app，不是 301/302
#   curl -v http://<测试IP>/api/v1/health     # 200，backend healthcheck
#
# 第一阶段 nginx 模板化（commit 待定）已让 prod-frontend 镜像支持 NGINX_*
# 注入；本 compose 不需要改 frontend 镜像，只需要按需 override 4 个变量。
# ============================================================================
name: myerp-staging

services:
  postgres:
    image: postgres:18-alpine
    container_name: myerp-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 暴露 5432 便于本地 psql 调试；只在测试服务器上对外，bind 0.0.0.0。
      # 想更严可以把 5432 换成 ssh 隧道，或加 firewall 限制。
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 父目录挂载：与 docker-compose.test.yml 一致（postgres 18 自己管 data/ 子目录；
      # 挂到 /var/lib/postgresql/data 会与镜像自带的 init 流程冲突）。
      - ./data/postgres-staging:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ${DOCKER_REPO}/prod-backend:${IMAGE_TAG:-latest}
    container_name: myerp-backend-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DATABASE_URL 走 compose 网络里的 postgres service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 以下与 docker-compose.yml 完全同 schema（值由 .env.staging 提供，可独立于生产）
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-hsh}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-2880}
      JWT_REFRESH_TOKEN_EXPIRE_MINUTES: ${JWT_REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      SNOWFLAKE_INSTANCE: ${SNOWFLAKE_INSTANCE:-0}
      SNOWFLAKE_SEQ: ${SNOWFLAKE_SEQ:-0}
      SNOWFLAKE_EPOCH: ${SNOWFLAKE_EPOCH:-1735689600000}
      SHELF_SEED_ON_MIGRATE: ${SHELF_SEED_ON_MIGRATE:-true}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET: ${COS_BUCKET}
      COS_SCHEME: ${COS_SCHEME:-https}
      COS_ENDPOINT: ${COS_ENDPOINT:-}
      COS_UPLOAD_PREFIX: ${COS_UPLOAD_PREFIX:-drawings/}
      COS_PRESIGN_EXPIRE: ${COS_PRESIGN_EXPIRE:-900}
      COS_MAX_FILE_SIZE: ${COS_MAX_FILE_SIZE:-104857600}
      COS_ALLOWED_TYPES: ${COS_ALLOWED_TYPES:-pdf,step,dwg,dxf,nc,tap,cnc,mpf,ngc}
      TZ: ${TZ:-Asia/Shanghai}
      APP_CPU_CORES: ${APP_CPU_CORES:-4}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-314572800}
    # 端口不暴露给宿主机；通过 frontend service 网络访问
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ${DOCKER_REPO}/prod-frontend:${IMAGE_TAG:-latest}
    container_name: myerp-frontend-staging
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 测试服务器只暴露 :80；不暴露 443
      - "${FRONTEND_PORT:-80}:80"
    # ❌ 不挂 SSL bind mount（测试服务器没证书、没域名）；
    #    entrypoint.sh 检测不到证书，自动走 nginx.http-only.conf 模板。
    environment:
      # 关键覆盖：让 nginx 模板渲染成 server_name 通配 + 无 301 → 同源相对跳转。
      # 见 frontend/nginx.http-only.conf + frontend/entrypoint.sh 的 envsubst 渲染逻辑。
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_REDIRECT_TARGET: ${NGINX_REDIRECT_TARGET:-}
      # 测试场景下证书挂不到；SSL_CRT_FILENAME / SSL_KEY_FILENAME 仅在【挂证书】时生效，
      # 这里给任意虚假文件名避免 entrypoint 默认值回退到生产 hsh-erp.cloud_*
      SSL_CRT_FILENAME: ${SSL_CRT_FILENAME:-staging-dummy.crt}
      SSL_KEY_FILENAME: ${SSL_KEY_FILENAME:-staging-dummy.key}
    # frontend/nginx.http-only.conf 已把 /api/ 反代到 backend:8000，service 名必须叫 backend

# 不引入命名卷（postgres 用 bind mount ./data/postgres-staging）
volumes: {}
