upstream myerp_backend {
    server backend:8000;
    keepalive 16;
}

# 通用片段：静态资源 + API 反代 + SPA fallback
# 同时被 HTTP / HTTPS server 复用，避免重复定义。
# 注意：HSTS 等「只 HTTPS 才合理」的 header 放在 HTTPS server 里 add_header，
#      不要在这个片段里，避免 HTTP 也带 HSTS 让用户被强制 HTTPS 锁住。
# HTTP 块：备案完成后强制 HTTPS，所有 :80 请求 301 到 https://hsh-erp.cloud
# - 静态资源 / API 反代 / SPA fallback 全部由 HTTPS server 块承担，HTTP 这里只剩重定向。
# - 用 $request_uri 而不是 $uri$is_args$args：保证 query string 也一并带过去。
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    return 301 ${NGINX_REDIRECT_TARGET}$request_uri;
}

# HTTPS 主服务：备案通过 + SSL 证书上传到 CVM 后启用。
# 当前 docker-compose.yml 没有 bind mount 443 端口和 SSL 证书文件，
# 这个 server 块暂不生效；备案通过后再：
#   1) 把 cert / key scp 到 CVM: /home/ubuntu/hsh-erp/ssl/
#   2) 在 docker-compose.yml 取消注释 443:443 + 两行 SSL bind mount
#   3) 重启 frontend: docker compose --env-file .env.production restart frontend
# >>> SSL_BLOCK_START <<<
server {
    listen 443 ssl;
    http2 on;
    server_name ${NGINX_SERVER_NAME};

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/${SSL_CRT_FILENAME};
    ssl_certificate_key /etc/nginx/ssl/${SSL_KEY_FILENAME};

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # gzip（与 HTTP 块保持一致）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml font/ttf;
    gzip_min_length 1024;

    # 安全 headers（HTTPS 多一条 HSTS）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # pdfjs worker 等 .mjs 模块脚本：显式声明 JS MIME。
    # 基础镜像 mime.types 缺失 mjs 映射时会被当作 application/octet-stream，
    # 浏览器「Strict MIME type checking for module scripts」拒绝作为 module 加载
    # （pdf 预览退化到主线程 fake worker）。正则 location 优先级高于 /assets/ 前缀，
    # 覆盖 /assets/ 下的 pdf.worker.min-*.mjs。
    #
    # 缓存 1h + 不强制 immutable：default_type 已声明 JS MIME，未来如再次 MIME 错配
    # 1 小时内浏览器自动 revalidate 拿到正确响应（nginx 不会因 expires + add_header
    # 双 Cache-Control 字段而长期保留旧的 octet-stream）。
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1h;
        try_files $uri =404;
    }

    # 后端 API 反代
    location /api/ {
        # 单次请求体上限（2026-07-22 新增）。
        # 批量图纸上传 POST /parts/batch-with-pdfs 需要带多 PDF multipart，
        # nginx 默认 1m 会被 413 拦截；与后端 BIZ_REQUEST_TOO_LARGE 守卫对齐。
        client_max_body_size       300m;
        client_body_buffer_size    1m;
        client_body_timeout        600s;

        proxy_pass         http://myerp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# <<< SSL_BLOCK_END <<<
