# HTTP-only 配置：SSL 证书缺失时由 entrypoint.sh 覆盖到 /etc/nginx/conf.d/default.conf。
#
# 背景：nginx.conf（HTTPS 版）的 :80 server 只 301 到 https://hsh-erp.cloud，
# 所有内容 location 都在 SSL 块内；证书缺失时旧 entrypoint 删掉 SSL 块后
# 只剩 301，本地 / 未备案环境完全无法访问。本文件提供纯 HTTP 完整服务，
# 与 nginx.conf 的 HTTPS server 块内容保持一致（除 SSL/HSTS 相关项）。
# ⚠️ 改这里时同步检查 nginx.conf HTTPS 块的对应 location，避免两处漂移。

upstream myerp_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    # server_name 由 NGINX_SERVER_NAME 注入；测试服务器设 _（通配），生产设 hsh-erp.cloud。
    # envsubst 不支持 ${VAR:-default} 语法，默认值兜底交给 docker-compose.yml 的
    # ${NGINX_SERVER_NAME:-...} 处理。
    server_name ${NGINX_SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml font/ttf;
    gzip_min_length 1024;

    # 安全 headers（不含 HSTS——HTTP 下带 HSTS 会把浏览器强制锁到 HTTPS）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # pdfjs worker 等 .mjs 模块脚本：显式声明 JS MIME。
    # 基础镜像 mime.types 缺失 mjs 映射时会被当作 application/octet-stream，
    # 浏览器「Strict MIME type checking for module scripts」拒绝作为 module 加载
    # （pdf 预览退化到主线程 fake worker）。正则 location 优先级高于 /assets/ 前缀，
    # 覆盖 /assets/ 下的 pdf.worker.min-*.mjs。
    #
    # 缓存 1h + 不强制 immutable：default_type 已声明 JS MIME，未来如再次 MIME 错配
    # 1 小时内浏览器自动 revalidate 拿到正确响应。
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1h;
        try_files $uri =404;
    }

    # 后端 API 反代
    location /api/ {
        # 单次请求体上限（2026-07-22 新增）。
        # 批量图纸上传 POST /parts/batch-with-pdfs 需要带多 PDF multipart，
        # nginx 默认 1m 会被 413 拦截；与后端 BIZ_REQUEST_TOO_LARGE 守卫对齐。
        # ⚠️ 与 nginx.conf 的 HTTPS server 同段保持同步（nginx.http-only.conf:7 已声明）。
        client_max_body_size       300m;
        client_body_buffer_size    1m;
        client_body_timeout        600s;

        proxy_pass         http://myerp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
