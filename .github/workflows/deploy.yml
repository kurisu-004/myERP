name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:    # 允许手动触发重部署

# 防止并发部署：同一分支排队，新部署不会打断进行中的部署
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}   # kurisu-004

jobs:
  # ============================================================
  # Job 1: 构建并推送 backend / frontend 镜像到 GHCR
  # ============================================================
  build-and-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # 推送到 GHCR 需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: Dockerfile
            image: myerp-backend
          - name: frontend
            context: ./frontend
            dockerfile: Dockerfile
            image: myerp-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        run: |
          echo "tag_latest=${REGISTRY}/${IMAGE_OWNER}/${{ matrix.image }}:latest" >> $GITHUB_OUTPUT
          echo "tag_sha=${REGISTRY}/${IMAGE_OWNER}/${{ matrix.image }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_latest }}
            ${{ steps.meta.outputs.tag_sha }}
          labels: |
            org.opencontainers.image.title=myerp-${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ============================================================
  # Job 2: SSH 到云服务器,拉取镜像并重启服务
  # ============================================================
  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"

            # 1. 把 Secret 里的 .env 内容写入服务器
            #    用 base64 避开 shell 转义和换行问题
            cd "$DEPLOY_PATH"
            echo "$ENV_FILE_CONTENT" > .env
            chmod 600 .env

            # 2. 拉取新镜像
            docker compose pull backend frontend

            # 3. 重启服务（孤儿容器清理）
            docker compose up -d --remove-orphans

            # 4. 清理 <none> 悬空镜像（保留最近 5 个）
            docker image prune -f --filter "until=24h"

            # 5. 等 backend 启动完成（启动时会跑 alembic upgrade head）
            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/api/v1/health > /dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                exit 0
              fi
              sleep 2
            done

            echo "HEALTH CHECK FAILED after 60s"
            echo "===== backend logs ====="
            docker compose logs --tail=200 backend || true
            echo "===== frontend logs ====="
            docker compose logs --tail=50 frontend || true
            exit 1

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployed ${{ github.sha }} to ${{ secrets.SSH_HOST }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy failed for ${{ github.sha }}"
          echo "Check the deploy job logs above for details."