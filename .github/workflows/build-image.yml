name: Build and push images

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ccr.ccs.tencentyun.com
  # 兜底值：若 vars.DOCKER_REPO 未注入（环境/权限/作用域问题），至少能拿到正确镜像仓库地址
  DOCKER_REPO: ${{ vars.DOCKER_REPO || 'ccr.ccs.tencentyun.com/hsh-erp' }}

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: ./Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Debug: print vars and env context
        run: |
          echo "vars.DOCKER_REPO=[${{ vars.DOCKER_REPO }}]"
          echo "REGISTRY=[${{ env.REGISTRY }}]"
          echo "DOCKER_REPO shell=[$DOCKER_REPO]"
          echo "DOCKER_REPO env-resolved=[${{ env.DOCKER_REPO }}]"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REPO }}/prod-${{ matrix.service }}:latest
            ${{ env.DOCKER_REPO }}/prod-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=myerp-${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
