name: myerp-test

# 测试专用编排：仅一个 postgres 容器，端口 5434，volume 隔离在 data/postgres-test/。
#
# 使用：
#   docker compose -f docker-compose.test.yml up -d
#   # ... 跑测试 ...
#   docker compose -f docker-compose.test.yml down -v
#
# 正常情况下不需要手动调这两个命令——tests/conftest.py 会在 pytest session
# 启动时自动 up、结束时自动 down -v。这里把编排显式列出来，便于调试。

services:
  postgres:
    image: postgres:18-alpine
    container_name: myerp-postgres-test
    # 测试容器用完即弃，绝不残留。
    restart: "no"
    environment:
      POSTGRES_USER: myerp_test
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: myerp_test
      TZ: Asia/Shanghai
    ports:
      - "5434:5432"
    volumes:
      # 挂父目录，让 postgres 18 自己管 data/ 子目录
      # （挂到 /var/lib/postgresql/data 会和镜像自带的初始化流程冲突，启动失败）
      - ./data/postgres-test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myerp_test -d myerp_test"]
      interval: 2s
      timeout: 3s
      # initdb + 启动 + WAL replay 留足时间，避免 pg_isready 过早 healthy。
      retries: 30
      start_period: 30s